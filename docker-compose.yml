services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - crew-data:/app/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  crew-data:
